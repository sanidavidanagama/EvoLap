name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "GEMINI.md"
      - ".gitignore"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "GEMINI.md"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Headless Simulation & Unit Tests (Ubuntu)
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: "dummy"
      SDL_AUDIODRIVER: "dummy"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check bytecode compilation
        run: uv run python -m compileall -q core physics simulation rendering tests scripts main.py

      - name: Verify headless deterministic physics
        run: uv run python tests/physics/verify_physics_headless.py

      - name: Run unit test suite
        run: uv run pytest -v
