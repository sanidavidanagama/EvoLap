name: Release Standalone Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Publish Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build standalone executable bundle
        run: uv run python scripts/build.py

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvoLap-windows-x64-bundle
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
